volumes:
  spool-slurmctld:
    external: false
  etc-slurm:
    external: false
  home:
    external: false
  slurm_acct_db:
    external: false


x-common-volumes: &common-volumes
  - spool-slurmctld:/var/spool/slurmctld
  - etc-slurm:/etc/slurm
  - home:/home

x-database-volumes: &database-volumes
  - slurm_acct_db:/var/lib/mysql

x-db-var: &db-var
  - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
  - MYSQL_USER=${MYSQL_USER:-slurm}
  - MYSQL_DATABASE=${MYSQL_DATABASE:-slurm_acct_db}
  - MYSQL_RANDOM_ROOT_PASSWORD=${MYSQL_RANDOM_ROOT_PASSWORD:-yes}

# All these variable are required for initialising database and cluster configuration.
# Once the cluster has initialised, it follows the configuration saved in the volumes on restart.
x-init-var-single: &init-var-single
  - SLURMCTLD_HOSTS=${SLURMCTLD_HOSTS:-slurm-container-master}
  - SLURMDBD_HOSTS=${SLURMDBD_HOSTS:-slurm-container-slurmdb}
  - CLUSTERNAME=${CLUSTERNAME:-demo}
  - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
  - MYSQL_USER=${MYSQL_USER:-slurm}
  - MYSQL_DATABASE=${MYSQL_DATABASE:-slurm_acct_db}
  - MYSQL_RANDOM_ROOT_PASSWORD=${MYSQL_RANDOM_ROOT_PASSWORD:-yes}
  - SLURMDBD_STORAGEHOST=${SLURMDBD_STORAGEHOST:-slurm-container-db}
  - CGROUP_CONSTRAINSWAPSPACE=${CGROUP_CONSTRAINSWAPSPACE:-no}
  - SLURMCTLD_OPTIONS=${SLURMCTLD_OPTIONS:--i}

x-init-var-ha: &init-var-ha
  - SLURMCTLD_HOSTS=${SLURMCTLD_HOSTS:-slurm-container-master-1,slurm-container-master-2}
  - SLURMDBD_HOSTS=${SLURMDBD_HOSTS:-slurm-container-slurmdb-1,slurm-container-slurmdb-2}
  - CLUSTERNAME=${CLUSTERNAME:-demo}
  - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
  - MYSQL_USER=${MYSQL_USER:-slurm}
  - MYSQL_DATABASE=${MYSQL_DATABASE:-slurm_acct_db}
  - MYSQL_RANDOM_ROOT_PASSWORD=${MYSQL_RANDOM_ROOT_PASSWORD:-yes}
  - SLURMDBD_STORAGEHOST=${SLURMDBD_STORAGEHOST:-slurm-container-db}
  - CGROUP_CONSTRAINSWAPSPACE=${CGROUP_CONSTRAINSWAPSPACE:-no}
  - SLURMCTLD_OPTIONS=${SLURMCTLD_OPTIONS:--i}

x-slurm-container: &slurm-container
  image: ${SLURM_IMAGE:-docker.io/csniper/slurm:${TAG:-26.05}}
  volumes: *common-volumes
  privileged: true
  restart: on-failure:10

services:
  mariadb:
    image: mariadb:lts
    container_name: slurm-container-db
    hostname: slurm-container-db
    volumes: *database-volumes
    environment: *db-var
    healthcheck:
      test: "healthcheck.sh --su-mysql --connect --innodb_initialized"

  # ==========================================
  # Single-node cluster services (profile: single)
  # ==========================================
  slurmdb:
    <<: *slurm-container
    profiles: ["single"]
    environment: *init-var-single
    hostname: slurm-container-slurmdb
    container_name: slurm-container-slurmdb
    command: --role slurmdbd
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6819  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      mariadb:
        condition: service_healthy

  master:
    <<: *slurm-container
    profiles: ["single"]
    environment: *init-var-single
    hostname: slurm-container-master
    container_name: slurm-container-master
    command: --role slurmctld
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6817  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      slurmdb:
        condition: service_healthy

  compute:
    <<: *slurm-container
    profiles: ["single", "ha"]
    environment:
      - SLURMCTLD_HOSTS=${SLURMCTLD_HOSTS:-slurm-container-master,slurm-container-master-1,slurm-container-master-2}
    command: --role slurmd
    deploy:
      mode: replicated
      replicas: ${COMPUTE_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6818  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      master:
        condition: service_healthy
        required: false
      master-1:
        condition: service_healthy
        required: false

  api:
    <<: *slurm-container
    profiles: ["single", "ha"]
    command: --role slurmrestd
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6820  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      master:
        condition: service_healthy
        required: false
      master-1:
        condition: service_healthy
        required: false

  client:
    <<: *slurm-container
    profiles: ["single", "ha"]
    environment:
      - SLURMCTLD_HOSTS=${SLURMCTLD_HOSTS:-slurm-container-master,slurm-container-master-1,slurm-container-master-2}
    command: --role sackd
    depends_on:
      master:
        condition: service_healthy
        required: false
      master-1:
        condition: service_healthy
        required: false

  # ==========================================
  # High-availability (HA) cluster services (profile: ha)
  # ==========================================
  slurmdb-1:
    <<: *slurm-container
    profiles: ["ha"]
    environment: *init-var-ha
    hostname: slurm-container-slurmdb-1
    container_name: slurm-container-slurmdb-1
    command: --role slurmdbd
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6819  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      mariadb:
        condition: service_healthy

  slurmdb-2:
    <<: *slurm-container
    profiles: ["ha"]
    environment: *init-var-ha
    hostname: slurm-container-slurmdb-2
    container_name: slurm-container-slurmdb-2
    command: --role slurmdbd
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6819  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      mariadb:
        condition: service_healthy

  master-1:
    <<: *slurm-container
    profiles: ["ha"]
    environment: *init-var-ha
    hostname: slurm-container-master-1
    container_name: slurm-container-master-1
    command: --role slurmctld
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6817  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      slurmdb-1:
        condition: service_healthy

  master-2:
    <<: *slurm-container
    profiles: ["ha"]
    environment: *init-var-ha
    hostname: slurm-container-master-2
    container_name: slurm-container-master-2
    command: --role slurmctld
    healthcheck:
      test: ["CMD-SHELL", "until nc -z localhost 6817  ; do sleep 10 ; done"]
      timeout: 72h
      interval: 5m
      start_period: 5s
    depends_on:
      slurmdb-1:
        condition: service_healthy
networks:
  default: {}
