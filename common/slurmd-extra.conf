[Service]
# dynamic node register
# Environment=SLURMD_OPTIONS="-Z"
Restart=on-failure
RestartSec=5
Delegate=cpuset cpu memory io pids
ExecStartPre=-/bin/sh -c 'for p in $$(cat /sys/fs/cgroup/cgroup.procs 2>/dev/null); do [ "$$p" != "$$$$" ] && echo "$$p" > /sys/fs/cgroup/init.scope/cgroup.procs 2>/dev/null || true; done; for c in cpuset cpu memory io pids; do grep -qw $$c /sys/fs/cgroup/cgroup.controllers 2>/dev/null && echo "+$$c" > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true; done'
